# https for CloudFront, with the certificate of hooks/prebuild/01_certificate.sh.
# Port 80 of Beanstalk stays, but the security group only lets CloudFront in on 443.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/planner/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planner/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    # Spring can't compress on the Tomcat of Beanstalk, so it happens here
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    gzip_proxied any;

    # The request log the enhanced health of Beanstalk reads
    include conf.d/elasticbeanstalk/healthd*.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The planner waits up to 25 seconds for changes before answering
        proxy_read_timeout 60s;
    }
}
