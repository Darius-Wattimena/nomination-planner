spring.jackson.default-property-inclusion: non_null

# The passwords on AWS, written by backend/.platform/hooks/prebuild/02_secrets.sh. Not there when running locally.
spring.config.import: "optional:file:/etc/bnplanner/secrets.yml"

# Not running on Kubernetes, the health check only needs the status
management.endpoint.health.probes.enabled: false

mongodb:
  host: localhost
  # Not used with a username and password, which connect through the srv record of the host instead
  port: 27017
  # With a username and password, the database that user is defined in, which can be another one than the planner uses
  auth-db: admin
  username: ""
  password: ""
  db: bnplanner

osu:
  client-id: ""
  client-secret: ""
  # Where osu! sends someone back to after logging in, the same as set at osu! for the OAuth application.
  # Empty for /login/oauth2/code/osu on the address the backend is reached on.
  redirect-uri: ""
  # At least this long between two calls to osu!. When osu! answers "too many requests", everything waits as long as osu! asks.
  min-request-interval-millis: 250

login:
  # Where someone ends up once they logged in
  website-url: http://localhost:3000
  # Turn on when the backend is reached through https
  secure-cookie: false

# Keep the collection of the previous version up to date, so it can be started again. Turn off once that is not needed anymore.
beatmaps.keep-old: true

# How long the website may wait for a change before it gets an empty answer, below the timeout of a proxy in between
planner.wait-millis: 25000

# The osu! ids of the users that may do everything on the planner, whatever their roles on osu! are
planner.admins: "2369776"

# Syncs the beatmaps in progress with osu! on its own, a few every minute. Needs a client id and secret.
osu.background-sync:
  enabled: false
  per-minute: 6

# Follows the nominations, qualifications, ranks, resets and disqualifications on osu! of the beatmaps on the planner.
# Needs a client id and secret. Starts at the newest event the first time, and continues where it stopped after a restart.
osu.follow-events:
  enabled: false
  every-seconds: 60

# Follows who joins or leaves the BN, probationary BN and NAT on osu!, and their gamemodes. Starts at the newest change the first time.
osu.follow-groups:
  enabled: false
  every-seconds: 600

cors:
  uris: http://localhost:3000,http://localhost:8080
  methods: GET,POST,PUT,OPTIONS,DELETE,PATCH
  headers: origin,content-type,accept,x-requested-with,x-csrf-token

discord:
  enabled: true
  token: ""
