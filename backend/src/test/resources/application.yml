spring.jackson.default-property-inclusion: non_null
spring.jackson.deserialization.fail-on-null-for-primitives: false
management.endpoint.health.probes.enabled: false

mongodb:
  host: localhost
  # Nothing listens here, tests get the port of their own MongoDB and never reach one running on this machine
  port: 1
  auth-db: admin
  username: ""
  password: ""
  db: bnplanner

osu:
  clientId: ""
  clientSecret: ""
  redirectUri: ""

recalculation.active: false

beatmaps.keep-old: true

planner.wait-millis: 400

osu.background-sync:
  enabled: false
  per-minute: 6

cors:
  uris: http://localhost:3000,http://localhost:8080
  methods: GET,POST,PUT,OPTIONS,DELETE,PATCH
  headers: origin,content-type,accept,x-requested-with,authorization

discord:
  enabled: false
  token: ""
  webhook: ""
  webhookPublic: ""

aiess:
  token: ""