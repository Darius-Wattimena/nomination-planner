spring.jackson.default-property-inclusion: non_null
management.endpoint.health.probes.enabled: false

mongodb:
  host: localhost
  # Nothing listens here, tests get the port of their own MongoDB and never reach one running on this machine
  port: 1
  auth-db: admin
  username: ""
  password: ""
  db: bnplanner

osu:
  client-id: "1"
  client-secret: ""
  redirect-uri: ""
  min-request-interval-millis: 0

login:
  website-url: http://localhost:3000

beatmaps.keep-old: true

planner.wait-millis: 400
# The osu! ids of the users that may do everything on the planner whatever their roles on osu! are, including exporting and
# importing ranked beatmaps
planner.developers: "2369776"

osu.background-sync:
  enabled: false
  per-minute: 6

osu.follow-events:
  enabled: false
  every-seconds: 60

osu.follow-groups:
  enabled: false
  every-seconds: 600

cors:
  uris: http://localhost:3000,http://localhost:8080
  methods: GET,POST,PUT,OPTIONS,DELETE,PATCH
  headers: origin,content-type,accept,x-requested-with,x-csrf-token

discord:
  enabled: false
  token: ""

discord.weekly-summary:
  enabled: false
  cron: "0 0 9 * * MON"
