AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The Nomination Planner on one address: CloudFront serves the website from a private S3 bucket
  and passes /v2, /oauth2 and /login/oauth2 on to the backend, one Elastic Beanstalk instance
  with its own Let's Encrypt certificate.

Parameters:
  Name:
    Type: String
    Default: beta
    AllowedPattern: "[a-z0-9-]+"
    Description: Short name of this setup, used in the names of everything it creates
  Domain:
    Type: String
    Default: beta-bnplanner.greaper.net
    Description: The address of the planner
  OriginDomain:
    Type: String
    Default: beta-bnplanner-origin.greaper.net
    Description: The address CloudFront reaches the backend on, which the instance gets a Let's Encrypt certificate for
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 hosted zone of greaper.net
  CloudFrontCertificateArn:
    Type: String
    AllowedPattern: "arn:aws:acm:us-east-1:.*"
    Description: The certificate for Domain, in us-east-1 as CloudFront requires
  ApplicationName:
    Type: String
    Default: bnplanner
    Description: The existing Elastic Beanstalk application
  SolutionStackName:
    Type: String
    Default: 64bit Amazon Linux 2023 v5.15.4 running Tomcat 11 Corretto 21
  InstanceType:
    Type: String
    Default: t4g.small
    Description: >-
      t4g.small has 2 GB, t4g.medium 4 GB. Keep an arm64 (Graviton) type, or change InstanceArchitecture along with it.
  InstanceArchitecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  CloudFrontPrefixList:
    Type: String
    Default: pl-4fa04526
    Description: com.amazonaws.global.cloudfront.origin-facing in this region, the only addresses allowed to reach the backend

  MongoHost:
    Type: String
    Description: The Atlas cluster, like cluster0.abcde.mongodb.net
  MongoDatabase:
    Type: String
    Default: bnplanner2
  MongoUsername:
    Type: String
  MongoPassword:
    Type: String
    NoEcho: true
  OsuClientId:
    Type: String
    Description: The osu! OAuth application with https://<Domain>/login/oauth2/code/osu as callback
  OsuClientSecret:
    Type: String
    NoEcho: true
  DiscordToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Leave empty to not post to Discord

  GitHubRepository:
    Type: String
    Default: Darius-Wattimena/nomination-planner
  GitHubEnvironment:
    Type: String
    Default: beta
    Description: Only workflow jobs in this GitHub environment can deploy
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: false when the account already has the token.actions.githubusercontent.com provider

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  WithDiscord: !Not [!Equals [!Ref DiscordToken, ""]]

Resources:
  # --- Website ---

  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "bnplanner-${Name}-website-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyThroughCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  WebsiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "bnplanner-${Name}-website"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Pages of the website have no file extension, they all get index.html
  WebsitePages:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "bnplanner-${Name}-pages"
      AutoPublish: true
      FunctionConfig:
        Comment: Sends every page of the website to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Nomination Planner (${Name})"
        Enabled: true
        Aliases: [!Ref Domain]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        Origins:
          - Id: website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: backend
            DomainName: !Ref OriginDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              # The planner waits up to 25 seconds for changes before answering
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebsitePages.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /v2/*
            TargetOriginId: backend
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewer: the login cookie, the query and the address the visitor used
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          - PathPattern: /oauth2/*
            TargetOriginId: backend
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          # osu! sends someone back here after logging in. /login itself is a page of the website.
          - PathPattern: /login/oauth2/*
            TargetOriginId: backend
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  WebsiteRecord:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref Domain
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            # The hosted zone of every CloudFront distribution
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref Domain
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  # --- Backend ---

  # Only CloudFront reaches the instance, nothing else is open
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "bnplanner-${Name} backend, only reached by CloudFront"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontPrefixList

  # Gets the certificate for OriginDomain through a DNS record, so no port has to be open for Let's Encrypt
  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "bnplanner-${Name}-backend"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
      Policies:
        - PolicyName: certificate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [route53:ListHostedZones, route53:GetChange]
                Resource: "*"
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsRecordTypes: [TXT]

  BackendProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "bnplanner-${Name}-backend"
      Roles: [!Ref BackendRole]

  Backend:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !Ref ApplicationName
      EnvironmentName: !Sub "bnplanner-${Name}"
      Description: !Sub "Backend of the Nomination Planner on ${Domain}"
      SolutionStackName: !Ref SolutionStackName
      Tier:
        Name: WebServer
        Type: Standard
      OptionSettings:
        # One instance with a fixed address, no load balancer. The beatmaps are kept in its memory anyway.
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: EnvironmentType
          Value: SingleInstance
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: ServiceRole
          Value: aws-elasticbeanstalk-service-role

        - Namespace: aws:ec2:instances
          OptionName: InstanceTypes
          Value: !Ref InstanceType
        - Namespace: aws:ec2:instances
          OptionName: SupportedArchitectures
          Value: !Ref InstanceArchitecture
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref BackendProfile
        # Instead of the default group, which opens port 80 to everyone
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: DisableDefaultEC2SecurityGroup
          Value: "true"
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: SecurityGroups
          Value: !Ref BackendSecurityGroup
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: DisableIMDSv1
          Value: "true"
        - Namespace: aws:elasticbeanstalk:command
          OptionName: DeploymentPolicy
          Value: AllAtOnce
        - Namespace: aws:elasticbeanstalk:container:tomcat:jvmoptions
          OptionName: Xms
          Value: 512m
        - Namespace: aws:elasticbeanstalk:container:tomcat:jvmoptions
          OptionName: Xmx
          Value: 1280m

        # Visitors who are not logged in get 401, which is not the backend being unhealthy
        - Namespace: aws:elasticbeanstalk:healthreporting:system
          OptionName: SystemType
          Value: enhanced
        - Namespace: aws:elasticbeanstalk:healthreporting:system
          OptionName: ConfigDocument
          Value: '{"Version":1,"Rules":{"Environment":{"Application":{"ApplicationRequests4xx":{"Enabled":false}}}}}'

        # Platform updates on Sunday night, for the security fixes
        - Namespace: aws:elasticbeanstalk:managedactions
          OptionName: ManagedActionsEnabled
          Value: "true"
        - Namespace: aws:elasticbeanstalk:managedactions
          OptionName: PreferredStartTime
          Value: "Sun:03:00"
        - Namespace: aws:elasticbeanstalk:managedactions:platformupdate
          OptionName: UpdateLevel
          Value: minor
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: StreamLogs
          Value: "true"
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: RetentionInDays
          Value: "14"
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: DeleteOnTerminate
          Value: "true"

        # Read by .platform/hooks of the backend
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: CERTIFICATE_DOMAIN
          Value: !Ref OriginDomain

        # The settings of the backend, see the README
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: mongodb.host
          Value: !Ref MongoHost
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: mongodb.db
          Value: !Ref MongoDatabase
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: mongodb.username
          Value: !Ref MongoUsername
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: mongodb.password
          Value: !Ref MongoPassword
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: osu.clientId
          Value: !Ref OsuClientId
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: osu.clientSecret
          Value: !Ref OsuClientSecret
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: osu.redirectUri
          Value: !Sub "https://${Domain}/login/oauth2/code/osu"
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: login.website-url
          Value: !Sub "https://${Domain}"
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: login.secure-cookie
          Value: "true"
        # The website is on the same address, so only for running it locally against this backend
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: cors.uris
          Value: !Sub "https://${Domain}"
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: beatmaps.keep-old
          Value: "false"
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: osu.background-sync.enabled
          Value: "true"
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: osu.follow-events.enabled
          Value: "true"
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: osu.follow-groups.enabled
          Value: "true"
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: discord.enabled
          Value: !If [WithDiscord, "true", "false"]
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: discord.token
          Value: !Ref DiscordToken

  OriginRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginDomain
      Type: A
      TTL: "300"
      # The fixed (elastic) IP address of the instance
      ResourceRecords: [!GetAtt Backend.EndpointURL]

  # --- Deploying from GitHub Actions, without stored access keys ---

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "bnplanner-${Name}-deploy"
      Description: !Sub "Deploys the planner to ${Domain} from GitHub Actions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      ManagedPolicyArns:
        # Beanstalk changes the instance and its own bucket during a deploy
        - arn:aws:iam::aws:policy/AdministratorAccess-AWSElasticBeanstalk
      Policies:
        - PolicyName: website
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt WebsiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${WebsiteBucket.Arn}/*"
              # Beanstalk hands the role of the instance on to it
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt BackendRole.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  Url:
    Value: !Sub "https://${Domain}"
  DeployRoleArn:
    Description: AWS_DEPLOY_ROLE of the GitHub environment
    Value: !GetAtt DeployRole.Arn
  WebsiteBucket:
    Description: WEBSITE_BUCKET of the GitHub environment
    Value: !Ref WebsiteBucket
  DistributionId:
    Description: CLOUDFRONT_DISTRIBUTION of the GitHub environment
    Value: !Ref Distribution
  BackendEnvironment:
    Description: BEANSTALK_ENVIRONMENT of the GitHub environment
    Value: !Ref Backend
