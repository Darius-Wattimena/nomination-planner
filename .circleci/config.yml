version: 2.1

jobs:
  build-backend:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/repo/backend
    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - checkout:
          path: ~/repo
      - restore_cache:
          keys:
            - backend-v1-{{ checksum "build.gradle.kts" }}
            - backend-v1-
      - run: ./gradlew dependencies --build-cache --parallel
      - run: ./gradlew build --build-cache --parallel
      - save_cache:
          paths:
            - ~/.gradle
            - ~/.embedmongo
          key: backend-v1-{{ checksum "build.gradle.kts" }}
      - store_test_results:
          path: build/test-results
      - store_artifacts:
          path: build/libs
          destination: wars
      - persist_to_workspace:
          root: ~/repo
          paths:
            - backend/build

  deploy-backend:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/repo/backend
    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - checkout:
          path: ~/repo
      - attach_workspace:
          at: ~/repo
      - restore_cache:
          keys:
            - backend-v1-{{ checksum "build.gradle.kts" }}
            - backend-v1-
      - run:
          name: Deploy to Elastic Beanstalk
          command: ./gradlew deployProduction

  build-frontend:
    docker:
      - image: cimg/node:22.14.0
    working_directory: ~/repo/frontend
    steps:
      - checkout:
          path: ~/repo
      - restore_cache:
          keys:
            - frontend-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          paths:
            - ~/.npm
          key: frontend-v1-{{ checksum "package-lock.json" }}
      - run: npm run build
      - persist_to_workspace:
          root: ~/repo
          paths:
            - frontend/build

  deploy-frontend:
    docker:
      - image: cimg/aws:2022.06
    working_directory: ~/repo
    steps:
      - attach_workspace:
          at: ~/repo
      - run:
          name: Deploy to AWS S3 bucket
          command: aws s3 sync frontend/build s3://bnplanner.greaper.net --delete --exact-timestamps
      - run:
          name: Invalidate CloudFront
          command: aws cloudfront create-invalidation --distribution-id E5XATFDRCHYNT --paths "/*"

workflows:
  backend:
    jobs:
      - build-backend:
          context: build-context
      - hold-backend:
          type: approval
          requires: [build-backend]
          filters:
            branches:
              only: master
      - deploy-backend:
          context: build-context
          requires: [hold-backend]
          filters:
            branches:
              only: master
  frontend:
    jobs:
      - build-frontend:
          context: build-context
      - hold-frontend:
          type: approval
          requires: [build-frontend]
          filters:
            branches:
              only: master
      - deploy-frontend:
          context: build-context
          requires: [hold-frontend]
          filters:
            branches:
              only: master
