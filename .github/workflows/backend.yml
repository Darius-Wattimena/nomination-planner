name: Backend

on:
  push:
    branches: [master]
    # A version tag, like v2.0.0, releases the backend and the frontend. Tags don't look at the paths.
    tags: ["v*"]
    paths: [backend/**, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, .github/workflows/backend.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The MongoDB the tests start, downloaded once
      - uses: actions/cache@v6
        with:
          path: ~/.embedmongo
          key: embedmongo-${{ runner.os }}-v1

      # Tests, formatting and the coverage check
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: backend-bundle
          path: backend/build/libs/bnplanner.zip
          retention-days: 14

  deploy:
    needs: build
    # Only a version tag deploys, also when started by hand on a tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The setup of infra/planner.yml. The variables of the environment say where it is.
    environment: beta
    permissions:
      contents: read
      # Logging in to AWS as the deploy role, only for deploying
      id-token: write
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      APPLICATION: bnplanner
      ENVIRONMENT: ${{ vars.BEANSTALK_ENVIRONMENT }}
    steps:
      # Deploy exactly the war that was built and tested, with the setup of the instance
      - uses: actions/download-artifact@v8
        with:
          name: backend-bundle

      # The role of infra/planner.yml, no stored access keys
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: eu-west-1

      - name: Deploy to Elastic Beanstalk
        run: |
          version="${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          bucket=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          key="$APPLICATION/$version.zip"
          aws s3 cp bnplanner.zip "s3://$bucket/$key"
          aws elasticbeanstalk create-application-version --application-name "$APPLICATION" \
            --version-label "$version" --source-bundle "S3Bucket=$bucket,S3Key=$key"
          aws elasticbeanstalk update-environment --environment-name "$ENVIRONMENT" --version-label "$version"
          aws elasticbeanstalk wait environment-updated --environment-names "$ENVIRONMENT"
