name: Backend

on:
  push:
    branches: [master]
    paths: [backend/**, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, .github/workflows/backend.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The MongoDB the tests start, downloaded once
      - uses: actions/cache@v6
        with:
          path: ~/.embedmongo
          key: embedmongo-${{ runner.os }}-v1

      # Tests, formatting and the coverage check
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: backend-war
          path: backend/build/libs/bnplanner.war
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Required reviewers on this environment take the place of the approval step of CircleCI
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      APPLICATION: bnplanner
      ENVIRONMENT: bnplanner-env
    steps:
      # Deploy exactly the war that was built and tested
      - uses: actions/download-artifact@v8
        with:
          name: backend-war

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy to Elastic Beanstalk
        run: |
          version="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          bucket=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          key="$APPLICATION/$version.war"
          aws s3 cp bnplanner.war "s3://$bucket/$key"
          aws elasticbeanstalk create-application-version --application-name "$APPLICATION" \
            --version-label "$version" --source-bundle "S3Bucket=$bucket,S3Key=$key"
          aws elasticbeanstalk update-environment --environment-name "$ENVIRONMENT" --version-label "$version"
          aws elasticbeanstalk wait environment-updated --environment-names "$ENVIRONMENT"
