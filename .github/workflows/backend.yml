name: Backend

on:
  push:
    branches: [master]
    paths: [backend/**, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, .github/workflows/backend.yml]
  workflow_dispatch:
  # The Release workflow builds with this before deploying
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The MongoDB the tests start, downloaded once
      - uses: actions/cache@v6
        with:
          path: ~/.embedmongo
          key: embedmongo-${{ runner.os }}-v1

      # Tests, formatting and the coverage check
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: backend-bundle
          path: backend/build/libs/bnplanner.zip
          retention-days: 14

