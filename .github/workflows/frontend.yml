name: Frontend

on:
  push:
    branches: [master]
    # A version tag, like v2.0.0, releases the backend and the frontend. Tags don't look at the paths.
    tags: ["v*"]
    paths: [frontend/**, .github/workflows/frontend.yml]
  pull_request:
    paths: [frontend/**, .github/workflows/frontend.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 14

  deploy:
    needs: build
    # Only a version tag deploys, also when started by hand on a tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The setup of infra/planner.yml. The variables of the environment say where it is.
    environment: beta
    permissions:
      contents: read
      # Logging in to AWS as the deploy role, only for deploying
      id-token: write
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: build

      # The role of infra/planner.yml, no stored access keys
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: eu-west-1

      - name: Deploy to the S3 bucket
        working-directory: .
        run: aws s3 sync build "s3://${{ vars.WEBSITE_BUCKET }}" --delete --exact-timestamps

      - name: Invalidate CloudFront
        working-directory: .
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION }}" --paths "/*"
